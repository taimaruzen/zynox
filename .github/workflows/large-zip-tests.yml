name: Large ZIP validation tests
on:
  push:
    branches:
      - feature/large-upload-validation-tests
  pull_request:
    paths:
      - 'server/largeZipInspection.ts'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/large-zip-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ZIP validation tests
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
