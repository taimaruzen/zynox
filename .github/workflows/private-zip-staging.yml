name: Private ZIP staging checks
on:
  push:
    branches: [feature/large-zip-private-staging]
  pull_request:
    paths: ['server/largeZip*', 'tests/**', 'package.json', '.github/workflows/private-zip-staging.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
