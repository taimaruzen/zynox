name: Large game registration checks
on:
  push:
    branches: [feature/large-upload-game-registration]
  pull_request:
    paths: ['server/largeGameRegistration.ts', 'src/UploadPage.tsx', 'server/index.ts', '.github/workflows/large-game-registration.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
